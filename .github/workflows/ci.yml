name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: python3 -m pytest test_qwen_omega.py -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff

      - name: ruff check
        run: ruff check qwen_omega.py install-qwen-coder.sh --select E,W,F,I || true

      - name: ruff format check
        run: ruff format --check qwen_omega.py qwen-omega.py test_qwen_omega.py

  shellcheck:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck install.sh
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          additional_files: "install.sh install-qwen-coder.sh uninstall.sh"
          severity: error

  dry-run:
    name: Dry-run smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: qwen-omega --version
        run: python3 qwen-omega.py --version

      - name: providers list
        run: python3 qwen-omega.py providers

      - name: generate dry-run (ollama, no network)
        run: |
          python3 qwen-omega.py generate \
            --provider ollama \
            --models 'qwen2.5-coder:7b-instruct-q4_K_M,qwen3-coder:latest' \
            --default-model 'qwen2.5-coder:7b-instruct-q4_K_M' \
            --dry-run

      - name: install-coder dry-run (ollama)
        run: |
          python3 qwen-omega.py install-coder \
            --backend ollama \
            --model 'qwen2.5-coder:7b-instruct-q4_K_M' \
            --dry-run

  build-check:
    name: Package build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ vars.PYTHON_VERSION || '3.12' }}"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Build standalone zipapp
        run: |
          python -m zipapp qwen_omega.py \
            --output dist/qwen-omega \
            --python '/usr/bin/env python3' \
            --compress

      - name: Verify wheel installs and CLI works
        run: |
          pip install dist/*.whl
          qwen-omega --version
          qwen-omega providers --query openrouter

