name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write   # for OIDC attestations

jobs:
  # ── 1. Build all packages ─────────────────────────────────────────────────
  build:
    name: Build packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ vars.PYTHON_VERSION || '3.12' }}"

      - name: Install build + test tools
        run: pip install build pytest

      - name: Run tests
        run: python3 -m pytest test_qwen_omega.py -v --tb=short

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches source
        run: |
          SOURCE_VER=$(python3 -c "import qwen_omega; print(qwen_omega.VERSION)")
          TAG_VER="${{ steps.version.outputs.VERSION }}"
          echo "Source: $SOURCE_VER  Tag: $TAG_VER"
          [ "$SOURCE_VER" = "$TAG_VER" ] || (echo "ERROR: version mismatch" && exit 1)

      - name: Build wheel and sdist
        run: python3 -m build --wheel --sdist

      - name: Build standalone zipapp
        run: |
          python3 -m zipapp qwen_omega.py \
            --output dist/qwen-omega \
            --python '/usr/bin/env python3' \
            --compress

      - name: Build legacy source archive
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCHIVE="qwen-omega-prometa-v${VERSION}.tar.gz"
          tar -czf "dist/$ARCHIVE" \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.backup.*' \
            --exclude='dist' \
            --exclude='*.egg-info' \
            --exclude='build' \
            .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-release
          path: dist/
          retention-days: 5

  # ── 2. Create GitHub Release ──────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-release
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md 2>/dev/null \
            || echo "See CHANGELOG.md for details.")
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Qwen Omega ProMeta v${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.NOTES }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/qwen-omega
            dist/SHA256SUMS
          draft: ${{ vars.RELEASE_DRAFT == 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── 3. Publish to PyPI ────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-release
          path: dist/

      - name: Publish wheel + sdist to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
