name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests before releasing
        run: python -m pytest test_qwen_omega.py -v --tb=short

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches source
        run: |
          SOURCE_VER=$(python -c "import importlib.util, pathlib; spec=importlib.util.spec_from_file_location('qo','qwen-omega.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print(m.VERSION)")
          TAG_VER="${{ steps.version.outputs.VERSION }}"
          echo "Source: $SOURCE_VER  Tag: $TAG_VER"
          [ "$SOURCE_VER" = "$TAG_VER" ] || (echo "ERROR: version mismatch" && exit 1)

      - name: Build release archive
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCHIVE="qwen-omega-prometa-v${VERSION}.tar.gz"
          tar -czf "$ARCHIVE" \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.backup.*' \
            .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md 2>/dev/null || echo "See CHANGELOG.md for details.")
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Qwen Omega ProMeta v${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.NOTES }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
