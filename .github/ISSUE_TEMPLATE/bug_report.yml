name: "\U0001F41B Bug Report"
description: Report incorrect behavior or a crash.
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: ["cvsz"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Please fill in as much detail as possible so we can reproduce and fix the issue quickly.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project is affected?
      options:
        - qwen-omega.py (generate / validate / repair / doctor / providers)
        - qwen-omega.py (install-coder subcommand)
        - install-qwen-coder.sh
        - install.sh / uninstall.sh
        - settings.json schema
        - Other
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend used
      options:
        - Ollama
        - DashScope
        - OpenRouter
        - SiliconFlow
        - Custom / vLLM / LM Studio
        - Not applicable
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: qwen-omega version
      description: Run `python qwen-omega.py --version`
      placeholder: "e.g. 1.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Run `python --version`
      placeholder: "e.g. 3.12.3"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal command(s) to reproduce the issue.
      placeholder: |
        1. export OPENROUTER_API_KEY='...'
        2. python qwen-omega.py install-coder --backend openrouter --free
        3. Error output ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant error output
      description: Paste the full terminal output. It will be formatted as code automatically.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before filing this one.
          required: true
        - label: I am using the latest version from `main`.
          required: false
