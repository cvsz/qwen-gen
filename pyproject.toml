[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-omega-prometa"
version = "1.3.0"
description = "Multi-provider LLM CLI for Qwen Code — 29+ presets, model filtering, free model catalog"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "cvsz" }]
keywords = [
  "qwen", "llm", "ai", "cli", "openai", "ollama",
  "openrouter", "dashscope", "model-configuration",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

# Zero runtime dependencies — pure stdlib
dependencies = []

[project.urls]
Homepage    = "https://github.com/cvsz/qwen-gen"
Repository  = "https://github.com/cvsz/qwen-gen"
Changelog   = "https://github.com/cvsz/qwen-gen/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/cvsz/qwen-gen/issues"

[project.scripts]
qwen-omega = "qwen_omega:main"

[tool.setuptools]
py-modules = ["qwen_omega"]

[tool.setuptools.package-data]
"*" = ["example-settings.json"]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]   # long lines in PRESET table are intentional

[tool.ruff.format]
quote-style = "double"

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
